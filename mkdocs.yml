site_name: Ալեքս Աղաջանյան — Fab School
site_description: Ալեքս Աղաջանյանի Fab School պորտֆոլիոն
site_author: Ալեքս Աղաջանյան
site_url: https://alexaghajanyan01.github.io/aleks_aghajanyan/

copyright: © 2026 Ալեքս Աղաջանյան

theme:
  name: material

  language: hy

  logo: images/favicon.svg
  favicon: images/favicon.svg

  font:
    text: Inter
    code: JetBrains Mono

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Մութ ռեժիմ

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Լուսավոր ռեժիմ

  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/theme.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed
  - toc:
      permalink: true

nav:
  - 🏠 Գլխավոր: index.md
  - 👤 Իմ մասին: Իմ մասին/index.md
  - 📝 Առաջադրանքներ: Առաջադրանքներ/index.md
  - 🚀 Նախագծեր: Նախագծեր/final-project.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alexaghajanyan01
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/