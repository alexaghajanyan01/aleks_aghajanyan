# ============================================================
# FAB ACADEMY — ALEKS
# Հայերեն անձնական փաստաթղթավորման կայք
# ============================================================

site_name: Ալեքս — Fab Academy
site_description: Ալեքսի Fab Academy փաստաթղթավորման կայքը
site_author: Ալեքս
copyright: "© 2026 Ալեքս — Fab Academy"

site_url: https://fibasile.fabcloud.io/fabacademy-student-template/

# ------------------------------------------------------------
# Լրացուցիչ կարգավորումներ
# ------------------------------------------------------------

extra:
  social:
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/fabacademany
      name: Instagram
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/fabacademany
      name: Facebook
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/academany
      name: LinkedIn

  # Ոսկեգույն թեմայի հիմնական գույները
  generator: false

# ------------------------------------------------------------
# ԹԵՄԱ
# ------------------------------------------------------------

theme:
  name: material

  language: hy

  palette:

    # Մուգ ռեժիմ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: fontawesome/solid/moon
        name: Մուգ ռեժիմ

      primary: black
      accent: amber

    # Բաց ռեժիմ
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: fontawesome/solid/sun
        name: Բաց ռեժիմ

      primary: white
      accent: amber

  font:
    text: Noto Sans Armenian
    code: JetBrains Mono

  icon:
    logo: material/robot-industrial

  favicon: images/favicon.svg

  features:

    # Նավիգացիա
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress

    # Բովանդակություն
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

    # Որոնում
    - search.suggest
    - search.highlight
    - search.share

    # Հարմարավետություն
    - toc.follow

  static_templates:
    - privacy

# ------------------------------------------------------------
# PLUGINS
# ------------------------------------------------------------

plugins:

  - search:
      lang:
        - en
        - hy

  - git-revision-date-localized:
      fallback_to_build_date: true
      enabled: !ENV [ENABLED_GIT_REVISION_DATE, False]

# ------------------------------------------------------------
# MARKDOWN
# ------------------------------------------------------------

markdown_extensions:

  - extra

  - smarty

  - admonition

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.snippets

  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.details

  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

  - toc:
      permalink: true
      toc_depth: 3